[project]
name = "datathon-7mlet-grupo-50"
version = "0.1.0"
description = "Plataforma adaptativa de ofertas com multi-armed bandit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.13.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "numpy>=1.24.0",
    "pyarrow>=15.0.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "jupyter>=1.0.0",
]

[project.scripts]
datathon-serve = "datathon.api.main:run"
datathon-train = "datathon.training.train:main"
datathon-evaluate = "datathon.evaluation.evaluator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datathon"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
]
